services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hookscope}
      POSTGRES_USER: ${POSTGRES_USER:-hookscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookscope_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    profiles: ["simulator"]
    build:
      context: ../apps/simulator
    init: true
    environment:
      HOOKSCOPE_API_URL: ${SIMULATOR_DOCKER_API_URL:-http://host.docker.internal:8080}
      HOOKSCOPE_API_KEY: ${HOOKSCOPE_API_KEY:-}
      SIMULATOR_PROFILE: ${SIMULATOR_PROFILE:-demo}
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-}
      SIMULATOR_EVENT_COUNT: ${SIMULATOR_EVENT_COUNT:-0}
      SIMULATOR_REQUEST_TIMEOUT_MS: ${SIMULATOR_REQUEST_TIMEOUT_MS:-5000}
      SIMULATOR_FAILURE_RATE: ${SIMULATOR_FAILURE_RATE:-20}
      SIMULATOR_FAILURE_MODE: ${SIMULATOR_FAILURE_MODE:-mixed}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
