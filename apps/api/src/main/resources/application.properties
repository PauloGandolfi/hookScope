spring.application.name=hookscope-api
server.port=${API_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hookscope}
spring.datasource.username=${DB_USER:hookscope}
spring.datasource.password=${DB_PASSWORD:hookscope_local}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.default-schema=hookscope
spring.flyway.schemas=hookscope
spring.flyway.create-schemas=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true
